<div class="page-head">
  <div class="wrap">
    <p class="kicker">Search</p>
    <h1>Search CatholicDoorway</h1>
    <p class="lede">Search prayers, guides, saints, Catholic terms and more.</p>
  </div>
</div>

<div class="wrap">
  <section class="section">
    <form class="site-search" id="site-search" role="search">
      <label for="site-q" class="sr-only">Search</label>
      <input class="search" id="site-q" type="search" placeholder="e.g. Memorare, godparent, Advent" autocomplete="off" enterkeyhint="search" autofocus>
      <button class="btn" type="submit">Search</button>
    </form>
    <p class="small muted" id="search-count" role="status" aria-live="polite"></p>
    <ol class="search-results" id="search-results"></ol>
  </section>
</div>
