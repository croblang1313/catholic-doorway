name: Fetch image candidates

# Manual helper: downloads freely licensed images (e.g. from Wikimedia Commons),
# resizes them, and pushes them to the image-candidates branch for review.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Image URLs, separated by spaces"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and resize
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          pip install -q pillow
          mkdir -p candidates
          i=0
          for u in $URLS; do
            i=$((i+1))
            curl -sSfL -A "CatholicDoorwayBot/1.0 (https://catholicdoorway.com)" "$u" -o "candidates/orig$i.jpg"
            python3 -c "
          import sys
          from PIL import Image, ImageOps
          im = ImageOps.exif_transpose(Image.open(sys.argv[1])).convert('RGB')
          a = im.copy(); a.thumbnail((2400, 2400)); a.save(sys.argv[2], quality=82, optimize=True, progressive=True)
          b = im.copy(); b.thumbnail((600, 600)); b.save(sys.argv[3], quality=70)
          " "candidates/orig$i.jpg" "candidates/c$i.jpg" "candidates/p$i.jpg"
            rm "candidates/orig$i.jpg"
            echo "$i $u" >> candidates/list.txt
            sleep 2
          done
          ls -la candidates
      - name: Push to image-candidates branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan image-candidates
          git rm -rq --cached .
          git add candidates
          git commit -qm "Image candidates"
          git push -f origin image-candidates
