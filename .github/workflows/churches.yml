name: Update church list

# Refreshes site/data/churches from OpenStreetMap every Monday, so the map
# works even when the public Overpass servers are busy or down.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: churches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download churches from OpenStreetMap
        run: python3 scripts/fetch_churches.py
      - name: Commit if changed
        run: |
          git add site/data/churches
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update church list from OpenStreetMap"
          git push
