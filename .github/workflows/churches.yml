name: Update church list

# Refreshes site/data/churches from Geofabrik's OpenStreetMap extracts every
# Monday, so the map never depends on the busy public Overpass servers.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: churches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Download churches from OpenStreetMap
        run: python3 scripts/fetch_churches.py
      - name: Commit if changed
        run: |
          git add site/data/churches
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update church list from OpenStreetMap"
          # Other commits may have landed during the long download; rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
