name: Rosary audio

# Generates the guided-Rosary voice clips with open-source text-to-speech
# (Piper for en/es/pt, Meta MMS for Tagalog) and commits them to site/audio/rosary.
# Runs when the generator or its texts change on a claude/ branch, or by hand.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/rosary_audio/**", ".github/workflows/rosary-audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosary-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe voice licenses
        if: hashFiles('scripts/rosary_audio/PROBE') != ''
        run: python3 scripts/rosary_audio/probe_voices.py
      - name: Install text-to-speech
        if: hashFiles('scripts/rosary_audio/PROBE') == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers numpy
      - name: Generate clips
        if: hashFiles('scripts/rosary_audio/PROBE') == ''
        run: python3 scripts/rosary_audio/generate.py
      - name: Commit if changed
        if: hashFiles('scripts/rosary_audio/PROBE') == ''
        run: |
          git add site/audio/rosary
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate guided Rosary audio"
          git push
