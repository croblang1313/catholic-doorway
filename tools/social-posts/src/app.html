<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Social Posts</title>
<style>
:root{--accent:#2563eb;--ink:#16181d;--muted:#5d6470;--line:#e2e5ea;--bg:#f6f7f9;--card:#fff;--ok:#157f3b;--bad:#b42318;--warn:#a15c07;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--ink);color:#fff;border-bottom:3px solid var(--accent)}
.bar strong{font-size:17px}
.bar .who{font-size:14px;opacity:.9}
.bar button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0 0 0 6px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:4px 0 16px}
h2{font-size:18px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px}
.banner{border-left:4px solid var(--accent);background:#fff;padding:10px 14px;border-radius:8px;margin:0 0 16px;font-size:15px}
.banner.test{border-color:var(--warn);background:#fff8eb}
.msg{padding:10px 14px;border-radius:8px;margin:0 0 16px;font-size:15px}
.msg.ok{background:#e9f7ee;color:var(--ok)}
.msg.err{background:#fdecea;color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs a{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0c6c2}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.field{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],input[type=url],textarea,select{width:100%;padding:10px 12px;border:1px solid #c9ced6;border-radius:8px;background:#fff}
textarea{min-height:140px;resize:vertical}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.counts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.counts .over{color:var(--bad);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.seg button.on{background:var(--accent);color:#fff}
.plats{display:flex;flex-wrap:wrap;gap:8px}
.plats label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;cursor:pointer;min-height:44px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.thumb{position:relative;width:104px;height:104px;border-radius:10px;overflow:hidden;background:#e9ecf0;border:1px solid var(--line)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.thumb .mv{position:absolute;bottom:4px;left:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.thumb .bar2{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.2)}
.thumb .bar2 i{display:block;height:100%;background:var(--accent);width:0}
.drop{border:2px dashed #c9ced6;border-radius:12px;padding:18px;text-align:center;background:#fff;cursor:pointer}
.drop.hot{border-color:var(--accent);background:#eef3ff}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th,table.list td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list a{font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#eef0f3;color:var(--muted);white-space:nowrap}
.pill.draft{background:#fff1d6;color:var(--warn)}
.pill.sent{background:#e2f5e9;color:var(--ok)}
.coach{border-color:#e6d3a3;background:#fffdf7}
.coach .score{display:inline-flex;align-items:baseline;gap:2px;font-weight:700;font-size:28px;color:var(--accent)}
.coach .score small{font-size:15px;color:var(--muted);font-weight:600}
.coach .sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 16px;margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.coach .sc b{color:var(--ink)}
.coach .alt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 0;background:#fff}
.coach .alt p{margin:0 0 8px;white-space:pre-wrap}
.coach details{margin-top:10px}
.sc-hi,.sc-mid,.sc-lo{display:inline-block;font-weight:800;border-radius:999px;padding:1px 9px;line-height:1.5}
.sc-hi{background:#16a34a;color:#fff}.sc-mid{background:#facc15;color:#1f1a00}.sc-lo{background:#dc2626;color:#fff}
.coach .score.sc-hi,.coach .score.sc-mid,.coach .score.sc-lo{font-size:26px;padding:4px 16px}
.coach .score.sc-hi small,.coach .score.sc-lo small{color:rgba(255,255,255,.85)}.coach .score.sc-mid small{color:#4a3f00}
tr.day td{background:#f3ead6;color:#5b4413;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px}
.pill.failed{background:#fdecea;color:var(--bad)}
.pill.todo,.pill.processing{background:#e8efff;color:var(--accent)}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.pv-head{display:flex;gap:10px;align-items:center;padding:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.pv-sub{color:var(--muted);font-size:13px}
.pv-text{padding:0 12px 12px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.pv-media{position:relative;background:#111}
.pv-media img,.pv-media video{display:block;width:100%;max-height:420px;object-fit:cover}
.pv-media .more{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.pv.instagram .pv-media img{aspect-ratio:4/5}
.pv.tiktok .pv-media video,.pv.youtube .pv-media video{aspect-ratio:9/16;max-height:480px;object-fit:cover}
.pv-note{padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.pv-note.bad{color:var(--bad)}
.results{list-style:none;margin:0;padding:0}
.results li{padding:10px 0;border-bottom:1px solid var(--line)}
.results li:last-child{border:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.phone{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fbfcfd}
.phone h3{margin:0 0 6px;font-size:16px}
.phone .row{margin-top:10px}
.login{max-width:420px;margin:40px auto}
.choose label{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}
details.howto{margin-top:14px}
details.howto summary{cursor:pointer;font-weight:600}
details.howto li{margin:6px 0}
code{background:#eef0f3;border-radius:4px;padding:1px 5px;font-size:14px}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:600px){h1{font-size:21px}.card{padding:14px}table.list .hide-s{display:none}.btn{width:100%}.row .btn{flex:1 1 auto}}
</style>
</head>
<body>
<header class="bar"><strong id="brand">Social Posts</strong><span class="who" id="who"></span></header>
<main id="app"><p class="empty">Loading…</p></main>
<script>
(function () {
	'use strict';
	var S = { settings: null, platforms: {}, posts: [], who: '' };
	var app = document.getElementById('app');
	var draft = null; // Compose state.

	function esc(s) {
		return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
	}
	function api(method, path, body) {
		var opt = { method: method, headers: { 'X-SP': '1' }, credentials: 'same-origin' };
		if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
		return fetch(path, opt).then(function (r) {
			return r.json().catch(function () { return {}; }).then(function (d) {
				if (r.status === 401) { showLogin(); throw new Error(d.error || 'Please sign in.'); }
				if (!r.ok) { throw new Error(d.error || ('Error ' + r.status)); }
				return d;
			});
		});
	}
	function flash(kind, text) {
		sessionStorageSet('sp_flash', JSON.stringify({ kind: kind, text: text }));
	}
	function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } }
	function takeFlash() {
		var v = null;
		try { v = sessionStorage.getItem('sp_flash'); sessionStorage.removeItem('sp_flash'); } catch (e) { /* ignore */ }
		if (!v) { return ''; }
		try { var f = JSON.parse(v); return '<div class="msg ' + (f.kind === 'ok' ? 'ok' : 'err') + '">' + esc(f.text) + '</div>'; } catch (e) { return ''; }
	}
	function siteName() { return (S.settings && S.settings.site_name) || 'Social Posts'; }
	function initials() {
		var w = siteName().replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/);
		return ((w[0] || 'S').charAt(0) + (w[1] ? w[1].charAt(0) : '')).toUpperCase();
	}
	function when(t) {
		if (!t) { return ''; }
		var d = new Date(t);
		return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
	}
	function postOn(d) { var t = new Date(d + 'T12:00:00'); return isNaN(t) ? d : t.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }); }
	function label(p) { return (S.platforms[p] && S.platforms[p].label) || p; }
	function statusPill(st) {
		var t = { draft: 'Waiting for approval', todo: 'Finish on phone', processing: 'Processing', failed: 'Needs attention', sent: 'Posted' }[st] || st;
		return '<span class="pill ' + esc(st) + '">' + esc(t) + '</span>';
	}
	function mediaSrc(m, ig) { return '/m/' + (ig && m.ig_key ? m.ig_key : m.key); }

	/* ---------------- Sign-in ---------------- */
	function showLogin(err) {
		document.getElementById('who').innerHTML = '';
		app.innerHTML = '<div class="login card"><h1>Social Posts</h1><p>Sign in to write and approve posts.</p>' +
			(err ? '<div class="msg err">' + esc(err) + '</div>' : '') +
			'<form id="lf"><label class="field" for="ln">Your name</label><input type="text" id="ln" autocomplete="name" placeholder="So posts show who wrote them">' +
			'<label class="field" for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" required>' +
			'<label style="display:flex;gap:8px;align-items:center;margin:14px 0"><input type="checkbox" id="lr" checked> Keep me signed in on this device</label>' +
			'<button class="btn" type="submit" style="width:100%">Sign in</button></form></div>';
		try { document.getElementById('ln').value = localStorage.getItem('sp_name') || ''; } catch (e) { /* ignore */ }
		document.getElementById('lf').onsubmit = function (e) {
			e.preventDefault();
			var name = document.getElementById('ln').value;
			try { localStorage.setItem('sp_name', name); } catch (er) { /* ignore */ }
			var b = this.querySelector('button'); b.disabled = true;
			fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ name: name, password: document.getElementById('lp').value, remember: document.getElementById('lr').checked }) })
				.then(function (r) { return r.json().then(function (d) { if (!r.ok) { throw new Error(d.error || 'Sign-in failed.'); } }); })
				.then(load).catch(function (er) { showLogin(er.message); });
		};
	}

	/* ---------------- Load + route ---------------- */
	function load() {
		return fetch('/api/state', { credentials: 'same-origin' }).then(function (r) {
			if (r.status === 401) { showLogin(); return null; }
			return r.json().then(function (d) {
				if (!r.ok) { throw new Error(d.error || 'Could not load.'); }
				S = d;
				document.documentElement.style.setProperty('--accent', S.settings.accent || '#2563eb');
				document.getElementById('brand').textContent = siteName();
				document.title = 'Social Posts · ' + siteName();
				document.getElementById('who').innerHTML = esc(S.who) + ' · <button type="button" id="so">Sign out</button>';
				document.getElementById('so').onclick = function () { api('POST', '/api/logout', {}).then(function () { showLogin(); }); };
				render();
				return d;
			});
		}).catch(function (e) { app.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
	}
	window.addEventListener('hashchange', function () { if (S.settings) { render(); } });

	function render() {
		var h = location.hash.replace(/^#/, '') || 'new';
		var todo = S.posts.filter(function (p) { return p.status !== 'sent'; }).length;
		var tabs = [['new', 'New post'], ['todo', 'To do' + (todo ? ' (' + todo + ')' : '')], ['history', 'History'], ['settings', 'Settings']];
		var top = '<h1>Social Posts</h1>' + takeFlash();
		if (S.settings.test_mode) {
			top += '<div class="banner test"><strong>Test mode is on.</strong> Nothing will be posted. Approving shows exactly what would have been sent. Turn it off under <a href="#settings">Settings</a> when you are ready.</div>';
		}
		top += '<nav class="tabs">' + tabs.map(function (t) { return '<a href="#' + t[0] + '" class="' + (h === t[0] || (h.indexOf(t[0]) === 0 && t[0] !== 'new') ? 'on' : '') + '">' + esc(t[1]) + '</a>'; }).join('') + '</nav>';
		if (h.indexOf('post/') === 0) { return viewPost(top, h.slice(5)); }
		if (h.indexOf('edit/') === 0) { return viewCompose(top, h.slice(5)); }
		if (h === 'todo') { return viewList(top, 'todo'); }
		if (h === 'history') { return viewList(top, 'history'); }
		if (h === 'settings') { return viewSettings(top); }
		return viewCompose(top, '');
	}

	/* ---------------- Lists ---------------- */
	function viewList(top, which) {
		var rows = S.posts.filter(function (p) { return which === 'todo' ? p.status !== 'sent' : true; });
		if (which === 'todo') {
			// Next in line first: by post date (undated last), then the photo post before the TikTok video.
			rows = rows.slice().sort(function (a, b) {
				var da = a.post_on || '9999-99-99', db = b.post_on || '9999-99-99';
				if (da !== db) { return da < db ? -1 : 1; }
				var ka = a.kind === 'video' ? 1 : 0, kb = b.kind === 'video' ? 1 : 0;
				return ka !== kb ? ka - kb : a.created - b.created;
			});
		}
		var html = top + '<div class="card"><h2>' + (which === 'todo' ? 'Waiting on you' : 'All posts') + '</h2>';
		if (!rows.length) {
			html += '<p class="empty">' + (which === 'todo' ? 'Nothing waiting. Nice.' : 'No posts yet.') + '</p>';
		} else {
			html += '<table class="list"><thead><tr><th>Post</th><th class="hide-s">Goes to</th><th>Status</th><th class="hide-s">When</th></tr></thead><tbody>';
			var lastDay = null;
			rows.forEach(function (p) {
				if (which === 'todo' && (p.post_on || '') !== lastDay) {
					lastDay = p.post_on || '';
					html += '<tr class="day"><td colspan="4">' + (lastDay ? esc(postOn(lastDay)) : 'No date set') + '</td></tr>';
				}
				var t = p.caption.length > 70 ? p.caption.slice(0, 70) + '…' : p.caption;
				html += '<tr><td><a href="#post/' + esc(p.id) + '">' + esc(t) + '</a><div class="hint">' + (p.kind === 'video' ? '<strong>' + esc(p.platforms.map(label).join(', ')) + ' video</strong>' : '<strong>' + esc(p.platforms.map(label).join(', ')) + '</strong> · ' + p.media.length + ' photo' + (p.media.length > 1 ? 's' : '')) + ' · by ' + esc(p.author) + (p.post_on ? ' · <strong>post on ' + esc(postOn(p.post_on)) + '</strong>' : '') + (p.coach && p.coach.score !== null && p.coach.score !== undefined ? ' · ' + scoreTag(p.coach.score) : '') + '</div></td>' +
					'<td class="hide-s">' + p.platforms.map(label).map(esc).join(', ') + '</td><td>' + statusPill(p.status) + '</td><td class="hide-s">' + esc(when(p.sent_at || p.created)) + '</td></tr>';
			});
			html += '</tbody></table>';
		}
		app.innerHTML = html + '</div>';
	}

	/* ---------------- Compose ---------------- */
	function viewCompose(top, id) {
		var existing = id ? S.posts.filter(function (p) { return p.id === id; })[0] : null;
		if (!draft || draft.id !== (existing ? existing.id : '')) {
			draft = existing ? { id: existing.id, kind: existing.kind, caption: existing.caption, title: existing.title, platforms: existing.platforms.slice(), media: existing.media.map(function (m) { return { key: m.key, ig_key: m.ig_key, type: m.type, src: '/m/' + m.key, done: true }; }) }
				: { id: '', kind: 'photo', caption: '', title: '', platforms: (S.settings.default_platforms || ['facebook', 'instagram']).slice(), media: [] };
		}
		var d = draft;
		var plats = Object.keys(S.platforms).filter(function (p) { return S.platforms[p][d.kind]; });
		var html = top + '<form class="card" id="cf"><h2>' + (d.id ? 'Edit draft' : 'New post') + '</h2>';
		if (!d.id) {
			html += '<div class="seg" role="group" aria-label="Post type"><button type="button" data-k="photo" class="' + (d.kind === 'photo' ? 'on' : '') + '">Photo post</button><button type="button" data-k="video" class="' + (d.kind === 'video' ? 'on' : '') + '">Video post</button></div>';
		}
		html += '<label class="field">' + (d.kind === 'video' ? 'Video' : 'Photos (up to 10)') + '</label>' +
			'<div class="drop" id="drop" tabindex="0" role="button">' + (d.kind === 'video' ? 'Tap to choose a video, or drop it here. MP4 or MOV, 25 MB or less. Vertical and under 90 seconds works everywhere.' : 'Tap to choose photos, or drop them here.') + '</div>' +
			'<input type="file" id="file" hidden ' + (d.kind === 'video' ? 'accept="video/mp4,video/quicktime"' : 'accept="image/*" multiple') + '>' +
			'<div class="thumbs" id="thumbs"></div>' +
			'<label class="field" for="cap">Post text</label><textarea id="cap" maxlength="2200" placeholder="Write it once. It goes to every place you tick.">' + esc(d.caption) + '</textarea><div class="counts" id="counts"></div>' +
			'<div id="ytbox"' + (d.kind === 'video' && d.platforms.indexOf('youtube') > -1 ? '' : ' hidden') + '><label class="field" for="ttl">YouTube title</label><input type="text" id="ttl" maxlength="100" value="' + esc(d.title) + '"><p class="hint">100 characters or fewer.</p></div>' +
			'<label class="field">Post to</label><div class="plats">' + plats.map(function (p) {
				return '<label><input type="checkbox" name="pl" value="' + p + '"' + (d.platforms.indexOf(p) > -1 ? ' checked' : '') + '> ' + esc(label(p)) + '</label>';
			}).join('') + '</div><p class="hint">' + esc(viaHint()) + '</p>' +
			'<div class="row" style="margin-top:18px"><button class="btn" type="submit" id="save">Save and preview</button>' + (d.id ? '<a class="btn ghost" href="#post/' + esc(d.id) + '">Cancel</a>' : '') + '</div></form>';
		app.innerHTML = html;
		var form = document.getElementById('cf');
		Array.prototype.forEach.call(form.querySelectorAll('.seg button'), function (b) {
			b.onclick = function () {
				if (d.kind === b.dataset.k) { return; }
				if (d.media.length && !confirm('Switching clears the files you added. Continue?')) { return; }
				d.kind = b.dataset.k; d.media = []; render();
			};
		});
		var file = document.getElementById('file'), drop = document.getElementById('drop');
		drop.onclick = function () { file.click(); };
		drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } };
		drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('hot'); };
		drop.ondragleave = function () { drop.classList.remove('hot'); };
		drop.ondrop = function (e) { e.preventDefault(); drop.classList.remove('hot'); addFiles(e.dataTransfer.files); };
		file.onchange = function () { addFiles(file.files); file.value = ''; };
		var cap = document.getElementById('cap');
		cap.oninput = function () { d.caption = cap.value; counts(); };
		var ttl = document.getElementById('ttl');
		if (ttl) { ttl.oninput = function () { d.title = ttl.value; }; }
		Array.prototype.forEach.call(form.querySelectorAll('input[name=pl]'), function (c) {
			c.onchange = function () {
				d.platforms = Array.prototype.map.call(form.querySelectorAll('input[name=pl]:checked'), function (x) { return x.value; });
				document.getElementById('ytbox').hidden = !(d.kind === 'video' && d.platforms.indexOf('youtube') > -1);
				counts();
			};
		});
		form.onsubmit = function (e) { e.preventDefault(); saveDraft(); };
		drawThumbs(); counts();
	}
	function viaHint() {
		var s = S.settings, auto = [], phone = [];

			'<label class="field" for="sl">Your website address</label><input type="text" inputmode="url" id="sl" placeholder="https://example.com" value="' + esc(s.site_link) + '"><p class="hint">Added to the end of Pinterest pins so people can click through.</p>' +
			'<label class="field" for="ac">Accent color</label><input type="color" id="ac" value="' + esc(s.accent) + '" style="width:64px;height:44px;padding:2px;border:1px solid #c9ced6;border-radius:8px">' +
			'<label class="field">Ticked on new posts</label><div class="plats">' + Object.keys(S.platforms).map(function (p) { return '<label><input type="checkbox" name="dp" value="' + p + '"' + (s.default_platforms.indexOf(p) > -1 ? ' checked' : '') + '> ' + esc(label(p)) + '</label>'; }).join('') + '</div>' +
			'<h2 style="margin-top:22px">Facebook and Instagram</h2>' +
			'<label class="field">Facebook posts</label><label style="display:block"><input type="radio" name="fv" value="meta"' + (s.facebook_via !== 'share' ? ' checked' : '') + '> Post automatically (the Meta app must be in Live mode, or only you will see the posts)</label><label style="display:block"><input type="radio" name="fv" value="share"' + (s.facebook_via === 'share' ? ' checked' : '') + '> Always send from my phone</label>' +
			'<label class="field">Instagram posts</label><label style="display:block"><input type="radio" name="iv" value="meta"' + (s.instagram_via !== 'share' ? ' checked' : '') + '> Post automatically</label><label style="display:block"><input type="radio" name="iv" value="share"' + (s.instagram_via === 'share' ? ' checked' : '') + '> Always send from my phone</label>' +
			'<div class="row" style="margin-top:18px"><button class="btn" type="submit">Save settings</button></div></form>';
		html += '<div class="card"><h2>Connect Facebook and Instagram</h2>';
		if (s.connected) {
			html += '<ul class="results"><li class="ok"><strong>Facebook Page:</strong> ' + esc(s.meta_page) + '</li><li class="' + (s.meta_ig_id ? 'ok' : 'bad') + '"><strong>Instagram:</strong> ' + (s.meta_ig_id ? '@' + esc(s.meta_ig_user) : 'not linked to this Page') + '</li></ul><p class="hint">Connected ' + esc(when(s.meta_at)) + '. This connection does not expire unless the Page admin removes it or changes their Facebook password.</p>';
		} else {
			html += '<p>Not connected yet. Follow the steps once. It takes about 10 minutes.</p>';
		}
		html += '<form id="mf"><label class="field" for="ut">Access token from Graph API Explorer</label><textarea id="ut" style="min-height:80px" autocomplete="off" placeholder="Paste it here. It is swapped for a Page connection that does not expire; the pasted token is not kept."></textarea>' +
			'<details class="howto"><summary>Optional: App ID and App Secret (swaps a short token for a long one)</summary><label class="field" for="ai">Meta App ID</label><input type="text" id="ai"><label class="field" for="as">Meta App Secret</label><input type="password" id="as" autocomplete="off"><p class="hint">Used once and not saved.</p></details>' +
			'<div id="choose"></div><div class="row" style="margin-top:14px"><button class="btn" type="submit" id="cn">' + (s.connected ? 'Connect again' : 'Connect') + '</button>' + (s.connected ? '<button class="btn danger" type="button" id="dc">Disconnect</button>' : '') + '</div></form>' +
			'<details class="howto"' + (s.connected ? '' : ' open') + '><summary>How to connect</summary><ol>' +
			'<li>Make sure your Instagram is a <strong>Business</strong> or <strong>Creator</strong> account linked to your Facebook Page (Page settings → Linked accounts).</li>' +
			'<li>At <a href="https://developers.facebook.com/apps/" target="_blank" rel="noopener">developers.facebook.com/apps</a>, sign in as a Page admin and create a <strong>Business</strong> app (or reuse one you have). In <strong>App settings → Basic</strong> add your domain, a privacy policy URL and a category, then switch the app to <strong>Live</strong>.</li>' +
			'<li>Open the <a href="https://developers.facebook.com/tools/explorer/" target="_blank" rel="noopener">Graph API Explorer</a>, pick the app, and add these permissions: <code>pages_show_list</code>, <code>pages_read_engagement</code>, <code>pages_manage_posts</code>, <code>business_management</code>, <code>instagram_basic</code>, <code>instagram_content_publish</code>.</li>' +
			'<li>Click <strong>Generate Access Token</strong>. When Facebook asks which Pages to allow, pick only the Page this site posts to, and its Instagram.</li>' +
			'<li>No App Secret? Open the token in the <a href="https://developers.facebook.com/tools/debug/accesstoken/" target="_blank" rel="noopener">Access Token Debugger</a> and click <strong>Extend Access Token</strong>; use the longer token.</li>' +
			'<li>Paste it above and click Connect. Then make a test post with test mode on before turning test mode off.</li></ol></details></div>';
		html += '<div class="card"><h2>Drafts from Claude or a script</h2>' + (s.drafts_api ? '<p class="ok">On. Drafts can be sent to <code>' + esc(origin) + '/api/drafts</code> with the drafts token. They wait here for approval.</p>' : '<p>Off. Add a secret named <code>DRAFTS_TOKEN</code> to the Worker to turn it on.</p>') + '<p class="hint">Social Posts ' + esc(s.version) + '</p></div>';
		app.innerHTML = html;
		document.getElementById('sf').onsubmit = function (e) {
			e.preventDefault();
			var b = { test_mode: document.getElementById('tm').checked, site_name: document.getElementById('sn').value, site_link: document.getElementById('sl').value, accent: document.getElementById('ac').value,
				facebook_via: (document.querySelector('input[name=fv]:checked') || {}).value, instagram_via: (document.querySelector('input[name=iv]:checked') || {}).value,
				default_platforms: Array.prototype.map.call(document.querySelectorAll('input[name=dp]:checked'), function (x) { return x.value; }) };
			api('POST', '/api/settings', b).then(function () { flash('ok', b.test_mode ? 'Saved. Test mode is on.' : 'Saved. Test mode is off, so approved posts will go live.'); return load(); }).catch(function (er) { alert(er.message); });
		};
		var dc = document.getElementById('dc');
		if (dc) { dc.onclick = function () { if (confirm('Disconnect Facebook and Instagram?')) { api('POST', '/api/disconnect', {}).then(function () { flash('ok', 'Disconnected.'); load(); }); } }; }
		document.getElementById('mf').onsubmit = function (e) {
			e.preventDefault();
			var cn = document.getElementById('cn'); cn.disabled = true; cn.textContent = 'Connecting…';
			api('POST', '/api/connect', { user_token: document.getElementById('ut').value, app_id: document.getElementById('ai').value, app_secret: document.getElementById('as').value }).then(function (r) {
				if (r.choose) {
					cn.disabled = false; cn.textContent = 'Connect';
					var c = document.getElementById('choose');
					c.innerHTML = '<p><strong>Which Page should posts go to?</strong></p><div class="choose">' + r.choose.map(function (pg) { return '<label><input type="radio" name="pg" value="' + esc(pg.id) + '"> ' + esc(pg.name) + (pg.ig_user ? ' <span class="hint">(Instagram @' + esc(pg.ig_user) + ')</span>' : ' <span class="hint">(no Instagram linked)</span>') + '</label>'; }).join('') + '</div><button class="btn" type="button" id="pk">Use this Page</button>';
					document.getElementById('pk').onclick = function () {
						var v = (document.querySelector('input[name=pg]:checked') || {}).value; if (!v) { alert('Pick a Page.'); return; }
						api('POST', '/api/connect/pick', { page_id: v }).then(done).catch(function (er) { alert(er.message); });
					};
					return;
				}
				done(r);
			}).catch(function (er) { cn.disabled = false; cn.textContent = 'Connect'; alert(er.message); });
			function done(r) { flash(r.warning ? 'err' : 'ok', r.warning || 'Connected. Facebook and Instagram are ready.'); load(); }
		};
	}

	load();
}());
</script>
</body>
</html>
